services:
  mongodb:
    image: mongo
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: sayari
      MONGO_INITDB_ROOT_PASSWORD: sayari
    networks:
      - mongodb_network

  keycloak:
    container_name: keycloak-EspritRecrutement
    image: quay.io/keycloak/keycloak:24.0.2
    command: start-dev
    volumes:
      - ./themes:/opt/keycloak/themes
    ports:
      - "9090:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - mongodb_network

  # ─── Jitsi corrigé ───────────────────────────────────────
  jitsi:
    image: jitsi/web:stable-9364
    container_name: jitsi-meet
    ports:
      - "8443:80"
    environment:
      - ENABLE_AUTH=0
      - ENABLE_GUESTS=1
      - PUBLIC_URL=http://localhost:8443
    networks:
      - mongodb_network

  # ─── SonarQube ───────────────────────────────────────────
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      sonar-db:
        condition: service_healthy
    networks:
      - mongodb_network

  # ─── PostgreSQL pour SonarQube ───────────────────────────
  sonar-db:
    image: postgres:15
    container_name: sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mongodb_network

volumes:
  data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:

networks:
  mongodb_network:
    driver: bridge