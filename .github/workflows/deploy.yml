name: CI/CD — Build and Deploy CV API

on:
  push:
    branches: [feature/cv-extraction-api]
  pull_request:
    branches: [feature/cv-extraction-api]

env:
  ACR_LOGIN_SERVER: acrcvapi.azurecr.io
  IMAGE_NAME: cv-api
  RESOURCE_GROUP: rg-cv-api
  APP_NAME: app-cv-api

jobs:
  # ─── Job 1 : Tests ───────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt && pip install pytest httpx
      - run: pytest tests/ -v --tb=short
        continue-on-error: true

  # ─── Job 2 : Build ───────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/cv-api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp/cv-api-image.tar
          retention-days: 1

  # ─── Job 3 : Push ACR ────────────────────────────────────────
  push:
    name: Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp
      - run: docker load --input /tmp/cv-api-image.tar
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Push image
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  # ─── Job 4 : Deploy ──────────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: push
    steps:
      - name: Apply settings + image via Azure REST API
        run: |
          # Obtenir token
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password" \
            -d "client_id=04b07795-8ddb-461a-bbee-02f9e1bf7b46" \
            -d "username=${{ secrets.AZURE_CLIENT_USERNAME }}" \
            -d "password=${{ secrets.AZURE_CLIENT_PASSWORD }}" \
            -d "scope=https://management.azure.com/.default" \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" \
            | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Token failed"
            exit 1
          fi
          echo "✅ Token OK"

          # Injecter les App Settings
          curl -s -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.Web/sites/${{ env.APP_NAME }}/config/appsettings?api-version=2023-01-01" \
            -d "{
              \"properties\": {
                \"DOCKER_REGISTRY_SERVER_URL\":           \"https://${{ env.ACR_LOGIN_SERVER }}\",
                \"DOCKER_REGISTRY_SERVER_USERNAME\":      \"${{ secrets.ACR_USERNAME }}\",
                \"DOCKER_REGISTRY_SERVER_PASSWORD\":      \"${{ secrets.ACR_PASSWORD }}\",
                \"WEBSITES_ENABLE_APP_SERVICE_STORAGE\":  \"false\",
                \"WEBSITES_PORT\":                        \"8000\",
                \"WEBSITES_CONTAINER_START_TIME_LIMIT\":  \"1800\",
                \"AZURE_STORAGE_KEY\":                    \"${{ secrets.AZURE_STORAGE_KEY }}\"
              }
            }"
          echo "✅ App settings applied"

          # Configurer l'image
          curl -s -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.Web/sites/${{ env.APP_NAME }}?api-version=2023-01-01" \
            -d "{
              \"properties\": {
                \"siteConfig\": {
                  \"linuxFxVersion\": \"DOCKER|${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.push.outputs.image_tag }}\"
                }
              }
            }"
          echo "✅ Image: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.push.outputs.image_tag }}"

      - name: Restart App Service
        run: |
          curl -s -X POST \
            -u "${{ secrets.AZURE_CLIENT_USERNAME }}:${{ secrets.AZURE_CLIENT_PASSWORD }}" \
            "https://${{ env.APP_NAME }}.scm.azurewebsites.net/api/restart"
          echo "✅ Restarted"

      - name: Health check
        run: |
          echo "⏳ Waiting 3min for model download from Azure Blob..."
          sleep 180
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://${{ env.APP_NAME }}.azurewebsites.net/health)
            echo "Attempt $i — Status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ API ready!"
              echo "🌐 URL:  https://${{ env.APP_NAME }}.azurewebsites.net"
              echo "📖 Docs: https://${{ env.APP_NAME }}.azurewebsites.net/docs"
              exit 0
            fi
            sleep 30
          done
          echo "⚠️ Still starting — check:"
          echo "az webapp log tail --name ${{ env.APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}"
          exit 0