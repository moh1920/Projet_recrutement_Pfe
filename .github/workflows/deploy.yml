name: CI/CD — Build and Deploy CV API

on:
  push:
    branches: [feature/cv-extraction-api]
  pull_request:
    branches: [feature/cv-extraction-api]

env:
  ACR_LOGIN_SERVER: acrcvapi.azurecr.io
  IMAGE_NAME: cv-api
  RESOURCE_GROUP: rg-cv-api
  APP_NAME: app-cv-api

jobs:
  # ─── Job 1 : Tests ───────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        continue-on-error: true

  # ─── Job 2 : Build Docker image ──────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (without push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Save image to tar for next job
          outputs: type=docker,dest=/tmp/cv-api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp/cv-api-image.tar
          retention-days: 1

  # ─── Job 3 : Push to ACR ─────────────────────────────────────
  push:
    name: Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/cv-api-image.tar

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push image to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  # ─── Job 4 : Deploy to Azure App Service ─────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_PASSWORD }}
          auth-type: SERVICE_PRINCIPAL

      - name: Configure container image
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config container set \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --container-image-name ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.push.outputs.image_tag }} \
              --container-registry-url https://${{ env.ACR_LOGIN_SERVER }} \
              --container-registry-user ${{ secrets.ACR_USERNAME }} \
              --container-registry-password ${{ secrets.ACR_PASSWORD }}

      - name: Set app settings
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp config appsettings set \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --settings \
                WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
                WEBSITES_PORT=8000

      - name: Restart App Service
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az webapp restart \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }}

      - name: Show deployed URL
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "✅ Deployed at:"
            az webapp show \
              --name ${{ env.APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "defaultHostName" -o tsv