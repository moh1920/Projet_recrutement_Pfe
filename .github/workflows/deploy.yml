name: CI/CD — Build and Deploy CV API

on:
  push:
    branches: [feature/cv-extraction-api]
  pull_request:
    branches: [feature/cv-extraction-api]

env:
  ACR_LOGIN_SERVER: acrcvapi.azurecr.io
  IMAGE_NAME: cv-api
  RESOURCE_GROUP: rg-cv-api
  APP_NAME: app-cv-api

jobs:
  # ─── Job 1 : Tests ───────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        continue-on-error: true

  # ─── Job 2 : Build Docker image ──────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (without push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/cv-api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp/cv-api-image.tar
          retention-days: 1

  # ─── Job 3 : Push to ACR ─────────────────────────────────────
  push:
    name: Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/cv-api-image.tar

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push image to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  # ─── Job 4 : Deploy to Azure App Service ─────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: push

    steps:
      # ── 4.1 : Configurer l'image du container ──────────────────
      - name: Set container image via Publish Profile
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ needs.push.outputs.image_tag }}

      # ── 4.2 : Injecter les variables d'environnement ───────────
      - name: Set app environment variables
        run: |
          curl -s -X PUT \
            -H "Content-Type: application/json" \
            -u "${{ secrets.AZURE_CLIENT_USERNAME }}:${{ secrets.AZURE_CLIENT_PASSWORD }}" \
            "https://${{ env.APP_NAME }}.scm.azurewebsites.net/api/settings" \
            -d '{
              "AZURE_STORAGE_KEY":                   "${{ secrets.AZURE_STORAGE_KEY }}",
              "WEBSITES_ENABLE_APP_SERVICE_STORAGE": "false",
              "WEBSITES_PORT":                       "8000",
              "DOCKER_REGISTRY_SERVER_URL":          "https://${{ env.ACR_LOGIN_SERVER }}",
              "DOCKER_REGISTRY_SERVER_USERNAME":     "${{ secrets.ACR_USERNAME }}",
              "DOCKER_REGISTRY_SERVER_PASSWORD":     "${{ secrets.ACR_PASSWORD }}"
            }'

      # ── 4.3 : Restart pour appliquer les changements ───────────
      - name: Restart App Service
        run: |
          curl -s -X POST \
            -u "${{ secrets.AZURE_CLIENT_USERNAME }}:${{ secrets.AZURE_CLIENT_PASSWORD }}" \
            "https://${{ env.APP_NAME }}.scm.azurewebsites.net/api/command" \
            -H "Content-Type: application/json" \
            -d '{"command": "echo restarting", "dir": "/site/wwwroot"}'

      # ── 4.4 : Vérifier que l'app répond ────────────────────────
      - name: Health check
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ env.APP_NAME }}.azurewebsites.net/health)
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ App not yet healthy (status $STATUS) — may still be starting"
          else
            echo "✅ App is healthy!"
          fi