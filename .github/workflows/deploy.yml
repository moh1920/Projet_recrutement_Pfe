name: CI/CD — Build and Deploy CV API

on:
  push:
    branches: [feature/cv-extraction-api]
  pull_request:
    branches: [feature/cv-extraction-api]

env:
  ACR_LOGIN_SERVER: acrcvapi.azurecr.io
  IMAGE_NAME: cv-api
  CONTAINER_APP_NAME: cv-api
  RESOURCE_GROUP: pfe-rg
  APP_URL: cv-api.graymoss-d46652df.francecentral.azurecontainerapps.io

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Tests
  # ══════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        continue-on-error: true

  # ══════════════════════════════════════════════
  # JOB 2 — Build Docker Image
  # ══════════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/cv-api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp/cv-api-image.tar
          retention-days: 1


    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/cv-api-image.tar

      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-trivy-

      - name: Trivy — diagnostic complet (non bloquant)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          output: trivy-diagnostic.txt
          exit-code: '0'

      - name: Afficher le diagnostic
        if: always()
        run: cat trivy-diagnostic.txt

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-diagnostic
          path: trivy-diagnostic.txt
          retention-days: 3

      - name: Trivy — scan vulnérabilités (bloquant CRITICAL/HIGH fixables)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-vuln.sarif
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload vulnérabilités SARIF → GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-cv-api-vuln

      - name: Trivy — scan secrets
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          scan-type: image
          scanners: secret
          format: sarif
          output: trivy-secret.sarif
          exit-code: '0'

      - name: Upload secrets SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-cv-api-secrets

      - name: Upload rapports Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-diagnostic.txt
            trivy-vuln.sarif
            trivy-secret.sarif
          retention-days: 14

  # ══════════════════════════════════════════════
  # JOB 4 — Push ACR + Deploy ACA
  # Sans OIDC — utilise ACR Admin + ACA token
  # ══════════════════════════════════════════════
  deploy:
    name: Push ACR & Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/cv-api-image.tar

      # ── Push vers ACR via Admin Credentials ───────────────────
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push image to ACR (sha + latest)
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Pushed ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # ── Deploy via Azure Container Apps API (sans SP) ─────────
      # Utilise un token Azure obtenu depuis les credentials ACR
      - name: Deploy new image to ACA via REST API
        run: |
          # Obtenir un token Azure via ACR refresh token
          # On utilise l'API REST Azure Container Apps directement
          SUBSCRIPTION_ID="57f3b357-ad26-4fb2-a0da-5e8b90f6d595"

          # Login Azure avec les credentials ACR (exchange token)
          TOKEN=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -d "scope=https://management.azure.com/.default" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")

          # Update Container App image via REST API
          curl -s -X PATCH \
            "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${{ env.RESOURCE_GROUP }}/providers/Microsoft.App/containerApps/${{ env.CONTAINER_APP_NAME }}?api-version=2024-03-01" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "properties": {
                "template": {
                  "containers": [{
                    "name": "${{ env.IMAGE_NAME }}",
                    "image": "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                  }]
                }
              }
            }'
          echo "✅ Deploy triggered"

      # ── Health check ──────────────────────────────────────────
      - name: Health Check
        run: |
          echo "⏳ Waiting 3 min for container startup + model download..."
          sleep 180
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ env.APP_URL }}/health")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ CV API is ready!"
              echo "🌐 https://${{ env.APP_URL }}"
              echo "📖 https://${{ env.APP_URL }}/docs"
              exit 0
            fi
            sleep 30
          done
          echo "⚠️ Still starting — check logs on Azure Portal"
          exit 0

      # ── Summary ───────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## CV API Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Image | \`${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Registry | ACR — \`${{ env.ACR_LOGIN_SERVER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | https://${{ env.APP_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📖 Docs | https://${{ env.APP_URL }}/docs |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏥 Health | https://${{ env.APP_URL }}/health |" >> $GITHUB_STEP_SUMMARY