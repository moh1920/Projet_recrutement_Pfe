name: CI/CD — Build and Deploy CV API

on:
  push:
    branches: [feature/cv-extraction-api]
  pull_request:
    branches: [feature/cv-extraction-api]

env:
  ACR_LOGIN_SERVER: acrcvapi.azurecr.io   # ton Azure Container Registry
  IMAGE_NAME: cv-api
  CONTAINER_APP_NAME: cv-api
  RESOURCE_GROUP: pfe-rg

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Tests
  # ══════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        continue-on-error: true

  # ══════════════════════════════════════════════
  # JOB 2 — Build Docker Image
  # ══════════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/cv-api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp/cv-api-image.tar
          retention-days: 1


  # ══════════════════════════════════════════════
  # JOB 4 — Push to ACR + Deploy ACA  (OIDC)
  # Docker Hub supprimé — ACR est le seul registry
  # ══════════════════════════════════════════════
  deploy:
    name: Push ACR & Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/cv-api-image.tar

      # ── Login Azure via OIDC (même technique que backend Java) ──
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Push vers ACR via az acr (pas besoin de docker login séparé) ──
      - name: Push image to ACR
        run: |
          az acr login --name acrcvapi
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          echo "✅ Pushed ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      # ── Appliquer les variables d'environnement ──────────────
      - name: Set environment variables on Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --set-env-vars \
              AZURE_STORAGE_KEY="${{ secrets.AZURE_STORAGE_KEY }}" \
              WEBSITES_PORT="8000"

      # ── Déployer la nouvelle image depuis ACR ────────────────
      - name: Deploy new image from ACR
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ── Récupérer l'URL publique ─────────────────────────────
      - name: Get app URL
        run: |
          URL=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" \
            --output tsv)
          echo "APP_URL=$URL" >> $GITHUB_ENV
          echo "🌐 URL:  https://$URL"
          echo "📖 Docs: https://$URL/docs"

      # ── Health check ─────────────────────────────────────────
      - name: Health Check
        run: |
          echo "⏳ Waiting 3 min for container startup + model download from Azure Blob..."
          sleep 180

          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ env.APP_URL }}/health")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ CV API is ready!"
              echo "🌐 https://${{ env.APP_URL }}"
              echo "📖 https://${{ env.APP_URL }}/docs"
              exit 0
            fi
            sleep 30
          done

          echo "⚠️  App still starting — check logs:"
          echo "az containerapp logs show --name ${{ env.CONTAINER_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --follow"
          exit 0

      # ── Summary GitHub Actions ───────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "## CV API Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Image | \`${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Registry | ACR — \`${{ env.ACR_LOGIN_SERVER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | https://${{ env.APP_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📖 Docs | https://${{ env.APP_URL }}/docs |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏥 Health | https://${{ env.APP_URL }}/health |" >> $GITHUB_STEP_SUMMARY