name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - pfe-dev
  pull_request:
    branches:
      - pfe-dev

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Build
  # ══════════════════════════════════════════════
  build:
    name: Build Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Application
        run: npm run build -- --configuration production

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 2 — Tests Unitaires
  # ══════════════════════════════════════════════
  test:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Unit Tests with Coverage
        run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadless --code-coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 3 — OWASP Dependency-Check
  # ══════════════════════════════════════════════
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: test

    permissions:
      security-events: write   # ← requis pour upload-sarif
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: ${{ runner.os }}-nvd-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-nvd-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            -DnvdApiKey=${NVD_API_KEY} \
            -Dformats=HTML,JSON,SARIF \
            -Dformat=ALL \
            --file pom.xml

      - name: Verify SARIF file exists
        if: always()
        run: |
          echo "=== Contenu de target/ ==="
          ls -la target/ | grep -i "dependency\|sarif" || echo "Aucun fichier SARIF trouvé"
          # Cherche le fichier SARIF peu importe son nom exact
          find target/ -name "*.sarif" 2>/dev/null || echo "Aucun .sarif dans target/"

      - name: Upload OWASP HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/dependency-check-report.*
          retention-days: 14

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4   # ← v3 → v4
        if: always()
        with:
          sarif_file: target/dependency-check-report.sarif

  # ══════════════════════════════════════════════
  # JOB 4 — Docker Build & Push
  # ══════════════════════════════════════════════
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: sonar
    if: github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/frontend/Dockerfile
          push: true
          tags: |
            sayarimohamed/pfe-frontend:latest
            sayarimohamed/pfe-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed sayarimohamed/pfe-frontend:${{ github.sha }}"

  # ══════════════════════════════════════════════
  # JOB 5 — Deploy Frontend Azure  ← même niveau que docker !
  # ══════════════════════════════════════════════
  deploy-frontend:
    name: Deploy Frontend Azure
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name pfe-frontend \
            --resource-group pfe-rg \
            --image sayarimohamed/pfe-frontend:${{ github.sha }}
