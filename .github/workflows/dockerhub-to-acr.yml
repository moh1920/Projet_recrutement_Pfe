name: Build → Docker Hub → ACR → Render

on:
  push:
    branches: [ "backend" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag à utiliser (ex: latest, 1.0.0)'
        required: false
        default: 'latest'

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Build l'image Docker depuis le code
  # ══════════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      sha_tag: ${{ steps.tag.outputs.sha_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || 'latest' }}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "sha_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t sayarimohamed/pfe-backend:${{ steps.tag.outputs.tag }} \
                       -t sayarimohamed/pfe-backend:${{ steps.tag.outputs.sha_tag }} \
                       -f docker/backend/Dockerfile .

      - name: Save image to tar
        run: |
          docker save sayarimohamed/pfe-backend \
            -o /tmp/pfe-backend.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/pfe-backend.tar
          retention-days: 1

  # ══════════════════════════════════════════════
  # JOB 2 — Push vers Docker Hub
  # ══════════════════════════════════════════════
  push-dockerhub:
    name: Push → Docker Hub
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/pfe-backend.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker push sayarimohamed/pfe-backend:${{ needs.build.outputs.image_tag }}
          docker push sayarimohamed/pfe-backend:${{ needs.build.outputs.sha_tag }}

      - name: Summary
        if: always()
        run: |
          echo "## Push → Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`sayarimohamed/pfe-backend:${{ needs.build.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA Tag | \`${{ needs.build.outputs.sha_tag }}\` |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════
  # JOB 3 — Sync Docker Hub → ACR
  # ══════════════════════════════════════════════
  sync-to-acr:
    name: Sync → ACR
    runs-on: ubuntu-latest
    needs: push-dockerhub

    env:
      DOCKERHUB_IMAGE: sayarimohamed/pfe-backend
      ACR_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/pfe-backend

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull from Docker Hub
        run: |
          docker pull ${{ env.DOCKERHUB_IMAGE }}:${{ needs.build.outputs.image_tag }}

      - name: Re-tag & Push to ACR
        run: |
          docker tag ${{ env.DOCKERHUB_IMAGE }}:${{ needs.build.outputs.image_tag }} \
                     ${{ env.ACR_IMAGE }}:latest
          docker tag ${{ env.DOCKERHUB_IMAGE }}:${{ needs.build.outputs.image_tag }} \
                     ${{ env.ACR_IMAGE }}:${{ needs.build.outputs.sha_tag }}
          docker push ${{ env.ACR_IMAGE }}:latest
          docker push ${{ env.ACR_IMAGE }}:${{ needs.build.outputs.sha_tag }}

      - name: Summary
        if: always()
        run: |
          echo "## Sync → ACR" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`${{ env.DOCKERHUB_IMAGE }}:${{ needs.build.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Destination | \`${{ env.ACR_IMAGE }}:latest\` |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════
  # JOB 4 — Deploy → Render
  # ══════════════════════════════════════════════
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: sync-to-acr

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Summary
        if: always()
        run: |
          echo "## Deploy → Render.com" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ secrets.ACR_LOGIN_SERVER }}/pfe-backend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | \`https://pfe-backend-latest-yvms.onrender.com\` |" >> $GITHUB_STEP_SUMMARY