name: Build → Docker Hub → ACR → Render

on:
  push:
    branches: [ "backend" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag à utiliser (ex: latest, 1.0.0)'
        required: false
        default: 'latest'

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Build l'image Docker depuis le code
  # ══════════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      sha_tag: ${{ steps.tag.outputs.sha_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG=${{ github.event.inputs.image_tag || 'latest' }}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "sha_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t sayarimohamed/pfe-backend:${{ steps.tag.outputs.tag }} \
                       -t sayarimohamed/pfe-backend:${{ steps.tag.outputs.sha_tag }} \
                       -f docker/backend/Dockerfile .

      - name: Save image to tar
        run: |
          docker save sayarimohamed/pfe-backend \
            -o /tmp/pfe-backend.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/pfe-backend.tar
          retention-days: 1

  # ══════════════════════════════════════════════
  # JOB 2 — Push vers Docker Hub
  # ══════════════════════════════════════════════
  push-dockerhub:
    name: Push → Docker Hub
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/pfe-backend.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker push sayarimohamed/pfe-backend:${{ needs.build.outputs.image_tag }}
          docker push sayarimohamed/pfe-backend:${{ needs.build.outputs.sha_tag }}

      - name: Summary
        if: always()
        run: |
          echo "## Push → Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`sayarimohamed/pfe-backend:${{ needs.build.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA Tag | \`${{ needs.build.outputs.sha_tag }}\` |" >> $GITHUB_STEP_SUMMARY

