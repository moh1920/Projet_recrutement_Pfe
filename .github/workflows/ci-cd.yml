name: CI/CD — Build and Deploy CV API

on:
  push:
    branches: [matching-ai]
  pull_request:
    branches: [matching-ai]

env:
  ACR_LOGIN_SERVER: acrcvapi.azurecr.io
  IMAGE_NAME: cv-api
  CONTAINER_APP_NAME: cv-api
  RESOURCE_GROUP: pfe-rg
  # CORRECTION 1 : pas de schéma https:// ici — il est ajouté explicitement dans les steps
  APP_URL: cv-api.graymoss-d46652df.francecentral.azurecontainerapps.io

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Run Tests
  # ─────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pytest httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        # continue-on-error supprimé — les tests bloquent réellement le pipeline

  # ─────────────────────────────────────────────
  # JOB 2 — Build Docker Image
  # ─────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/cv-api-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp/cv-api-image.tar
          retention-days: 1

  # ─────────────────────────────────────────────
  # JOB 3 — Push to ACR & Deploy to Azure Container Apps
  # ─────────────────────────────────────────────
  deploy:
    name: Push ACR & Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cv-api-docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/cv-api-image.tar

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push image to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      # CORRECTION 2 : WEBSITES_PORT aligné sur le Dockerfile (8001, pas 8000)
      # CORRECTION 3 : montage du volume Azure File Share pour le modèle BGE-M3
      #   → crée d'abord le storage via :
      #     az containerapp env storage set --name <env> --resource-group pfe-rg \
      #       --storage-name bge-m3-share --azure-file-account-name <account> \
      #       --azure-file-account-key <key> --azure-file-share-name bge-m3 \
      #       --access-mode ReadOnly
      - name: Deploy new image + env vars to ACA
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars \
              AZURE_STORAGE_KEY="${{ secrets.AZURE_STORAGE_KEY }}" \
              HUGGINGFACEHUB_API_TOKEN="${{ secrets.HUGGINGFACEHUB_API_TOKEN }}" \
              WEBSITES_PORT="8001"

      # CORRECTION 4 : montage du volume pour le cache HuggingFace (tokenizers)
      #   Optionnel mais évite un re-download complet à chaque redéploiement.
      #   Nécessite un second Azure File Share "hf-cache" configuré dans l'env ACA.
      # - name: Mount HF cache volume
      #   run: |
      #     az containerapp update \
      #       --name ${{ env.CONTAINER_APP_NAME }} \
      #       --resource-group ${{ env.RESOURCE_GROUP }} \
      #       --volume name=hf-cache,storageType=AzureFile,storageName=hf-cache-share \
      #       --container-volume-mounts volumeName=hf-cache,mountPath=/app/hf_cache

      # CORRECTION 5 : poll immédiat sans sleep fixe — couvre jusqu'à ~7 min
      - name: Health Check
        run: |
          echo "⏳ Polling health endpoint (max 20 attempts × 20s = ~7 min)..."
          for i in {1..20}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://${{ env.APP_URL }}/health")
            echo "Attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ CV API is ready!"
              exit 0
            fi
            sleep 20
          done
          echo "❌ Health check failed after 20 attempts (~7 min)"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## CV API Deployment" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Image | \`${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 URL | https://${{ env.APP_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📖 Docs | https://${{ env.APP_URL }}/docs |" >> $GITHUB_STEP_SUMMARY