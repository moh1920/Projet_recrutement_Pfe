name: Java CI with Maven

on:
  push:
    branches: [ "backend" ]
  pull_request:
    branches: [ "backend" ]

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Build
  # ══════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar
          retention-days: 1

  # ══════════════════════════════════════════════
  # JOB 2 — Tests Unitaires
  # ══════════════════════════════════════════════
  test:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    needs: build

    env:
      SPRING_PROFILES_ACTIVE: test
      MATCHING_API_URL: http://localhost:8001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests & Coverage
        run: mvn -B test jacoco:report --file pom.xml -e -Dspring.profiles.active=test
        continue-on-error: true

      - name: Print test failure details
        if: always()
        run: |
          echo "=== SUREFIRE REPORTS ==="
          cat target/surefire-reports/esprit.PfeBackendProject.PfeBackendProjectApplicationTests.txt || true
          echo "=== ALL FAILED TESTS ==="
          grep -r "FAILED\|ERROR\|Exception" target/surefire-reports/ || true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 3a — OWASP Dependency-Check  (parallèle)
  # ══════════════════════════════════════════════
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: ${{ runner.os }}-nvd-v12-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-nvd-v12-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=11 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            -DnvdApiKey=${NVD_API_KEY} \
            -Dformats=HTML,JSON,SARIF \
            --file pom.xml 2>&1 | tee /tmp/owasp.log || true

      - name: Upload log Maven OWASP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-maven-log
          path: /tmp/owasp.log
          retention-days: 3

      - name: Upload OWASP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/
          if-no-files-found: warn
          retention-days: 14

      - name: Fix SARIF — tronquer les rule IDs trop longs
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        run: |
          python3 - <<'EOF'
          import json
          sarif_path = "target/dependency-check-report.sarif"
          with open(sarif_path, "r", encoding="utf-8") as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              for rule in driver.get("rules", []):
                  if len(rule.get("id", "")) > 255:
                      rule["id"] = rule["id"][:255]
              for result in run.get("results", []):
                  if len(result.get("ruleId", "")) > 255:
                      result["ruleId"] = result["ruleId"][:255]
          with open(sarif_path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)
          print("SARIF corrige avec succes.")
          EOF

      - name: Upload SARIF -> GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Resume OWASP dans le Summary
        if: always()
        run: |
          echo "## OWASP Dependency-Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/dependency-check-report.html ]; then
            CRITICAL=$(grep -o "cvss[^\"]*\">[0-9]\+\.[0-9]\+" /tmp/owasp.log \
              | awk -F'>' '{if($2+0>=9) count++} END{print count+0}')
            HIGH=$(grep -o "cvss[^\"]*\">[0-9]\+\.[0-9]\+" /tmp/owasp.log \
              | awk -F'>' '{if($2+0>=7 && $2+0<9) count++} END{print count+0}')
            echo "| Severite | Nombre |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| CRITICAL (>= 9) | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| HIGH (7-9) | ${HIGH} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Rapport complet disponible dans les **Artifacts -> owasp-report**" >> $GITHUB_STEP_SUMMARY
          else
            echo ":warning: Rapport non genere - voir **owasp-maven-log** pour les details." >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════════════
  # JOB 3b — SonarCloud Analysis  (parallèle)
  # ══════════════════════════════════════════════
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: target/

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mvn -B test jacoco:report sonar:sonar \
            -Dsonar.projectKey=mohamed-sayari_Projet_recrutement_Pfe \
            -Dsonar.organization=moh1920 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --file pom.xml

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          scanMetadataReportFile: target/sonar/report-task.txt

  # ══════════════════════════════════════════════
  # JOB 4 — Docker Build & Push → ACR
  # ══════════════════════════════════════════════
  docker:
    name: Docker Build & Push → ACR
    runs-on: ubuntu-latest
    needs: [ sonar, owasp ]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push → ACR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/pfe-backend:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/pfe-backend:${{ github.sha }}
          build-args: |
            PROFILE=prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed ${{ secrets.ACR_LOGIN_SERVER }}/pfe-backend:${{ github.sha }}"

  # ══════════════════════════════════════════════
  # JOB 5 — Deploy → ACI
  # ══════════════════════════════════════════════
  deploy-backend:
    name: Deploy Backend → ACI
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Azure CLI Login
        run: |
          az login \
          --username "${{ secrets.AZURE_USERNAME }}" \
          --password "${{ secrets.AZURE_PASSWORD }}" \
          --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Deploy to ACI
        run: |
          az container create \
            --resource-group pfe-rg \
            --name pfe-backend \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/pfe-backend:${{ github.sha }} \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --cpu 1 \
            --memory 1.5 \
            --ports 8080 \
            --dns-name-label pfe-backend-${{ github.run_number }} \
            --environment-variables \
              SPRING_PROFILES_ACTIVE=prod \
            --restart-policy Always

      - name: Get public URL
        run: |
          FQDN=$(az container show \
            --resource-group pfe-rg \
            --name pfe-backend \
            --query ipAddress.fqdn \
            --output tsv)
          echo "URL: http://${FQDN}:8080"

      - name: Summary
        if: always()
        run: |
          FQDN=$(az container show \
            --resource-group pfe-rg \
            --name pfe-backend \
            --query ipAddress.fqdn -o tsv 2>/dev/null || echo "N/A")
          echo "## Deploy Backend → ACI" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ secrets.ACR_LOGIN_SERVER }}/pfe-backend:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | \`http://${FQDN}:8080\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ACR (pfecregistry) |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════
  # JOB 6 — Monitoring → Azure Monitor
  # ══════════════════════════════════════════════
  monitor:
    name: Enable Azure Monitor
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.event_name == 'push'
    continue-on-error: true

    steps:
      - name: Azure CLI Login
        run: |
          az login \
            --username ${{ secrets.AZURE_USERNAME }} \
            --password ${{ secrets.AZURE_PASSWORD }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Enable container logs
        run: |
          az container logs \
            --resource-group pfe-rg \
            --name pfe-backend || true

      - name: Summary
        if: always()
        run: |
          echo "## Monitoring → Azure Monitor" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Statut |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Azure Monitor | Activé sur ACI |" >> $GITHUB_STEP_SUMMARY
          echo "| Logs | Disponibles dans Azure Portal → pfe-backend |" >> $GITHUB_STEP_SUMMARY