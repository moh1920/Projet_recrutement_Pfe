name: Java CI with Maven

on:
  push:
    branches: [ "backend" ]
  pull_request:
    branches: [ "backend" ]

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Build
  # ══════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar
          retention-days: 1

  # ══════════════════════════════════════════════
  # JOB 2 — Tests Unitaires
  # ══════════════════════════════════════════════
  test:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests & Coverage
        run: mvn -B test jacoco:report --file pom.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 3 — OWASP Dependency-Check
  # Scanne les CVE dans les dépendances Maven (pom.xml)
  # Bloque si CVE CVSS >= 7
  # ══════════════════════════════════════════════
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: test

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: ${{ runner.os }}-nvd-v12-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-nvd-v12-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: true
        id: owasp_scan
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=50 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            -DnvdApiKey=${NVD_API_KEY} \
            -Dformats=HTML,JSON,SARIF \
            --file pom.xml 2>&1 | tee /tmp/owasp.log
          echo "OWASP_EXIT=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Debug — logs Maven OWASP
        if: always()
        run: |
          echo "=== Exit code ==="
          echo "${OWASP_EXIT}"
          echo ""
          echo "=== Lignes ERROR / WARNING ==="
          grep -E "\[ERROR\]|\[WARNING\]|Exception|FAIL|suppressionFile|NVD|OutOfMemory" \
            /tmp/owasp.log || echo "Aucune ligne trouvée"
          echo ""
          echo "=== 50 dernières lignes ==="
          tail -50 /tmp/owasp.log
          echo ""
          echo "=== Fichiers générés dans target/ ==="
          find target/ -name "*dependency*" -o -name "*.sarif" 2>/dev/null \
            || echo "Aucun fichier dependency-check trouvé"

      - name: Upload log Maven OWASP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-maven-log
          path: /tmp/owasp.log
          retention-days: 3

      - name: Upload OWASP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/
          if-no-files-found: warn
          retention-days: 14

      - name: Fix SARIF — tronquer les rule IDs trop longs
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        run: |
          python3 - <<'EOF'
          import json

          sarif_path = "target/dependency-check-report.sarif"

          with open(sarif_path, "r", encoding="utf-8") as f:
              sarif = json.load(f)

          for run in sarif.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              for rule in driver.get("rules", []):
                  if len(rule.get("id", "")) > 255:
                      rule["id"] = rule["id"][:255]
              for result in run.get("results", []):
                  if len(result.get("ruleId", "")) > 255:
                      result["ruleId"] = result["ruleId"][:255]

          with open(sarif_path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)

          print("SARIF corrigé avec succès.")
          EOF

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Fail si CVE critique detectee
        if: env.OWASP_EXIT != '0'
        run: |
          echo "Des CVE de score CVSS >= 50 ont ete detectees."
          echo "Consulte l artefact owasp-report pour le detail."
          exit 1

  # ══════════════════════════════════════════════
  # JOB 4 — SonarCloud Analysis
  # ══════════════════════════════════════════════
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: owasp

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: target/

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B test jacoco:report sonar:sonar \
            -Dsonar.projectKey=mohamed-sayari_Projet_recrutement_Pfe \
            -Dsonar.organization=moh1920 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --file pom.xml

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          scanMetadataReportFile: target/sonar/report-task.txt

  # ══════════════════════════════════════════════
  # JOB 5 — Docker Build & Push
  # (uniquement sur push, pas sur PR)
  # ══════════════════════════════════════════════
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: sonar
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend/Dockerfile
          push: true
          tags: |
            sayarimohamed/pfe-backend:latest
            sayarimohamed/pfe-backend:${{ github.sha }}
          build-args: |
            PROFILE=prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed sayarimohamed/pfe-backend:${{ github.sha }}"

  # ══════════════════════════════════════════════
  # JOB 6 — Trivy Security Scan  ← NOUVEAU
  # Scanne l'image Docker pour détecter :
  #   • CVE dans l'OS de base (ubuntu/alpine/etc.)
  #   • CVE dans les dépendances embarquées dans le JAR
  #   • Secrets exposés accidentellement dans l'image
  #   • Mauvaises configurations Docker (misconfigs)
  # ══════════════════════════════════════════════
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Cache la base de données Trivy pour éviter de la retélécharger
      # (~200 MB, mise à jour quotidienne par Aqua Security)
      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-trivy-

      # ── Scan 1 : Vulnérabilités dans l'image Docker ──
      # Scanne l'OS de base + toutes les libs embarquées dans le JAR
      # Sévérités ciblées : HIGH et CRITICAL uniquement
      - name: Trivy — scan vulnérabilités image Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sayarimohamed/pfe-backend:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-vuln.sarif
          exit-code: '1'
          ignore-unfixed: true
          # ignore-unfixed: ne bloque que sur les CVE qui ont un correctif disponible
          # Les CVE sans correctif sont signalées mais ne bloquent pas le pipeline

      - name: Upload vulnérabilités SARIF → GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-vuln.sarif
          category: trivy-image-vuln

      # ── Scan 2 : Secrets exposés dans l'image ──
      # Détecte les tokens, clés API, mots de passe commités par erreur
      - name: Trivy — scan secrets dans l'image
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: sayarimohamed/pfe-backend:${{ github.sha }}
          scan-type: image
          scanners: secret
          format: sarif
          output: trivy-secret.sarif
          exit-code: '1'

      - name: Upload secrets SARIF → GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-secret.sarif
          category: trivy-image-secrets

      # ── Scan 3 : Mauvaises configurations Dockerfile ──
      # Vérifie les best practices Docker : USER non-root, HEALTHCHECK, etc.
      - name: Trivy — scan misconfigurations Dockerfile
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-misconfig.sarif
          exit-code: '0'
          # exit-code: 0 = signaler sans bloquer (les misconfigs sont souvent intentionnelles)

      - name: Upload misconfigs SARIF → GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-misconfig.sarif
          category: trivy-misconfig

      # ── Rapport texte complet (lisible dans les logs) ──
      - name: Trivy — rapport table lisible
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: sayarimohamed/pfe-backend:${{ github.sha }}
          scan-type: image
          scanners: vuln,secret
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          exit-code: '0'

      # ── Upload des rapports SARIF comme artefacts ──
      - name: Upload rapports Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-vuln.sarif
            trivy-secret.sarif
            trivy-misconfig.sarif
          retention-days: 14

  # ══════════════════════════════════════════════
  # JOB 7 — Deploy Backend Azure
  # ══════════════════════════════════════════════
  deploy-backend:
    name: Deploy Backend Azure
    runs-on: ubuntu-latest
    needs: trivy        # ← attend que Trivy passe avant de déployer
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name pfe-backend \
            --resource-group pfe-rg \
            --image sayarimohamed/pfe-backend:${{ github.sha }}