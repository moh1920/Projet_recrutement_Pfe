name: Java CI with Maven

on:
  push:
    branches: [ "backend" ]
  pull_request:
    branches: [ "backend" ]

jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Build
  # ══════════════════════════════════════════════
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build
        run: mvn -B package -DskipTests --file pom.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: target/*.jar
          retention-days: 1

  # ══════════════════════════════════════════════
  # JOB 2 — Tests Unitaires
  # ══════════════════════════════════════════════
  test:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    needs: build

    env:
      SPRING_PROFILES_ACTIVE: test
      MATCHING_API_URL: http://localhost:8001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests & Coverage
        run: mvn -B test jacoco:report --file pom.xml -e -Dspring.profiles.active=test
        continue-on-error: true

      - name: Print test failure details
        if: always()
        run: |
          echo "=== SUREFIRE REPORTS ==="
          cat target/surefire-reports/esprit.PfeBackendProject.PfeBackendProjectApplicationTests.txt || true
          echo "=== ALL FAILED TESTS ==="
          grep -r "FAILED\|ERROR\|Exception" target/surefire-reports/ || true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  # ══════════════════════════════════════════════
  # JOB 3a — OWASP Dependency-Check  (parallèle)
  # ══════════════════════════════════════════════
  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: ${{ runner.os }}-nvd-v12-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-nvd-v12-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=11 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            -DnvdApiKey=${NVD_API_KEY} \
            -Dformats=HTML,JSON,SARIF \
            --file pom.xml 2>&1 | tee /tmp/owasp.log || true

      - name: Upload log Maven OWASP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-maven-log
          path: /tmp/owasp.log
          retention-days: 3

      - name: Upload OWASP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report
          path: target/
          if-no-files-found: warn
          retention-days: 14

      - name: Fix SARIF — tronquer les rule IDs trop longs
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        run: |
          python3 - <<'EOF'
          import json
          sarif_path = "target/dependency-check-report.sarif"
          with open(sarif_path, "r", encoding="utf-8") as f:
              sarif = json.load(f)
          for run in sarif.get("runs", []):
              driver = run.get("tool", {}).get("driver", {})
              for rule in driver.get("rules", []):
                  if len(rule.get("id", "")) > 255:
                      rule["id"] = rule["id"][:255]
              for result in run.get("results", []):
                  if len(result.get("ruleId", "")) > 255:
                      result["ruleId"] = result["ruleId"][:255]
          with open(sarif_path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)
          print("SARIF corrige avec succes.")
          EOF

      - name: Upload SARIF -> GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('target/dependency-check-report.sarif') != ''
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check

      - name: Resume OWASP dans le Summary
        if: always()
        run: |
          echo "## OWASP Dependency-Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/dependency-check-report.html ]; then
            CRITICAL=$(grep -o "cvss[^\"]*\">[0-9]\+\.[0-9]\+" /tmp/owasp.log \
              | awk -F'>' '{if($2+0>=9) count++} END{print count+0}')
            HIGH=$(grep -o "cvss[^\"]*\">[0-9]\+\.[0-9]\+" /tmp/owasp.log \
              | awk -F'>' '{if($2+0>=7 && $2+0<9) count++} END{print count+0}')
            echo "| Severite | Nombre |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| CRITICAL (>= 9) | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| HIGH (7-9) | ${HIGH} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Rapport complet disponible dans les **Artifacts -> owasp-report**" >> $GITHUB_STEP_SUMMARY
          else
            echo ":warning: Rapport non genere - voir **owasp-maven-log** pour les details." >> $GITHUB_STEP_SUMMARY
          fi

  # ══════════════════════════════════════════════
  # JOB 3b — SonarCloud Analysis  (parallèle)
  # ══════════════════════════════════════════════
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: target/

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mvn -B test jacoco:report sonar:sonar \
            -Dsonar.projectKey=mohamed-sayari_Projet_recrutement_Pfe \
            -Dsonar.organization=moh1920 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --file pom.xml

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          scanMetadataReportFile: target/sonar/report-task.txt

  # ══════════════════════════════════════════════
  # JOB 4 — Docker Build & Push
  # ══════════════════════════════════════════════
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [ sonar, owasp ]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/backend/Dockerfile
          push: true
          tags: |
            sayarimohamed/pfe-backend:latest
            sayarimohamed/pfe-backend:${{ github.sha }}
          build-args: |
            PROFILE=prod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Image pushed sayarimohamed/pfe-backend:${{ github.sha }}"

  # ══════════════════════════════════════════════
  # JOB 5 — Deploy Backend Kubernetes
  # ══════════════════════════════════════════════
  deploy-backend:
    name: Deploy Backend Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Option A : cluster cloud (ex. GKE / EKS / AKS)
      # Remplacez ce step par la bonne action selon votre provider :
      #   GKE  → google-github-actions/get-gke-credentials@v2
      #   EKS  → aws-actions/amazon-eks-update-kubeconfig
      #   AKS  → azure/aks-set-context@v3
      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v4        # ← remplacer si autre provider
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}   # secret contenant le fichier kubeconfig

      # ── Substitue l'image dans le manifest avant apply
      - name: Set image tag in manifest
        run: |
          sed -i "s|sayarimohamed/pfe-backend:.*|sayarimohamed/pfe-backend:${{ github.sha }}|g" \
            k8s/backend/deployment.yaml

      # ── Applique les manifests (Deployment + Service + Ingress)
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply --validate=false -f k8s/backend/deployment.yaml
          kubectl apply --validate=false -f k8s/backend/service.yaml

      # ── Attend la fin du rollout (timeout 5 min)
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/pfe-backend \
            --namespace=default \
            --timeout=300s \
            --validate=false || true

      # ── Résumé
      - name: Summary
        if: always()
        run: |
          echo "## Deploy Backend" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`sayarimohamed/pfe-backend:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          EXTERNAL_IP=$(kubectl get svc pfe-backend \
            --namespace=default \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "en attente")
          echo "| External IP | ${EXTERNAL_IP} |" >> $GITHUB_STEP_SUMMARY

  # ══════════════════════════════════════════════
  # JOB 6 — Prometheus + Grafana Monitoring (K8s)
  # ══════════════════════════════════════════════
  monitor:
    name: Deploy Prometheus + Grafana (K8s)
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.event_name == 'push'
    continue-on-error: true


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v4        # ← même provider que deploy-backend
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # ── Prometheus (ConfigMap + Deployment + Service)
      - name: Deploy Prometheus
        continue-on-error: true
        run: |
          kubectl apply --validate=false -f k8s/monitoring/prometheus/

      # ── Grafana (Deployment + Service + Secret admin-password)
      - name: Create Grafana admin secret
        continue-on-error: true
        run: |
          kubectl create secret generic grafana-admin \
            --namespace=default \
            --from-literal=admin-password=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Grafana
        continue-on-error: true
        run: |
          kubectl apply --validate=false -f k8s/monitoring/grafana/

      # ── Résumé
      - name: Summary
        if: always()
        continue-on-error: true
        run: |
          GRAFANA_IP=$(kubectl get svc grafana \
            --namespace=default \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "en attente")
          echo "## Monitoring" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Adresse |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Grafana | http://${GRAFANA_IP}:3000 |" >> $GITHUB_STEP_SUMMARY
          echo "| Prometheus | interne pfe-prometheus:9090 |" >> $GITHUB_STEP_SUMMARY