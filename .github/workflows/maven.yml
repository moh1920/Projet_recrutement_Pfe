name: Java CI with Maven

on:
  push:
    branches: [ "backend" ]
  pull_request:
    branches: [ "backend" ]

jobs:
  # ════════════════════════════════════════════════
  # JOB 1 — Build + Test + SonarQube
  # ════════════════════════════════════════════════
  build-and-analyse:
    name: Build, Test & SonarQube
    runs-on: ubuntu-latest

    steps:
      # ① Checkout complet (obligatoire pour SonarQube)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ② JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ③ Cache SonarQube
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # ④ Build (sans tests)
      - name: Build
        run: mvn -B package -DskipTests --file pom.xml

      # ⑤ Tests + rapport JaCoCo
      - name: Tests & Coverage
        run: mvn -B test jacoco:report --file pom.xml

      # ⑥ Publier les rapports de test
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/

      # ⑦ Analyse SonarQube
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --file pom.xml

      # ⑧ Quality Gate — bloque si KO
      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
