apiVersion: apps/v1
kind: Deployment
metadata:
  name: pfe-prometheus
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pfe-prometheus
  template:
    metadata:
      labels:
        app: pfe-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - containerPort: 9090
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config