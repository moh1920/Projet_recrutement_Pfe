<div class="candidates-container">
    <div class="header-actions">
        <h1 class="page-title">Gestion des Candidats</h1>
        <button mat-raised-button color="primary" (click)="openAddDialog()">
            <mat-icon>add</mat-icon>
            Ajouter un Candidat
        </button>
    </div>

    <div class="filter-section">
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Rechercher un candidat...</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Nom, Spécialité ou Email" #input>
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
    </div>

    <div class="table-container mat-elevation-z8">
        <table mat-table [dataSource]="dataSource" matSort>

            <!-- Name Column -->
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Candidat </th>
                <td mat-cell *matCellDef="let row">
                    <div class="candidate-info">
                        <span class="name">{{row.name}}</span>
                        <span class="email">{{row.email}}</span>
                    </div>
                </td>
            </ng-container>

            <!-- Specialty Column -->
            <ng-container matColumnDef="specialty">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Spécialité </th>
                <td mat-cell *matCellDef="let row"> {{row.specialty}} </td>
            </ng-container>

            <!-- Experience Column -->
            <ng-container matColumnDef="experience">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Exp. (Ans) </th>
                <td mat-cell *matCellDef="let row"> {{row.experience}} ans </td>
            </ng-container>

            <!-- Score Column -->
            <ng-container matColumnDef="score">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Score IA </th>
                <td mat-cell *matCellDef="let row">
                    <span class="score-badge" [class.high]="row.score > 80">{{row.score}}/100</span>
                </td>
            </ng-container>

            <!-- Status Column -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Statut </th>
                <td mat-cell *matCellDef="let row">
                    <span class="status-chip" [ngClass]="getStatusColor(row.status)">
                        {{row.status}}
                    </span>
                </td>
            </ng-container>

            <!-- Actions Column -->
            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Actions </th>
                <td mat-cell *matCellDef="let row">
                    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Actions">
                        <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                        <button mat-menu-item>
                            <mat-icon>visibility</mat-icon>
                            <span>Voir Profil</span>
                        </button>
                        <button mat-menu-item>
                            <mat-icon>psychology</mat-icon>
                            <span>Relancer Analyse</span>
                        </button>
                        <button mat-menu-item>
                            <mat-icon>event</mat-icon>
                            <span>Inviter Entretien</span>
                        </button>
                        <mat-divider></mat-divider>
                        <button mat-menu-item (click)="deleteCandidate(row.id)">
                            <mat-icon color="warn">delete</mat-icon>
                            <span>Supprimer</span>
                        </button>
                    </mat-menu>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">Aucune donnée correspondant au filtre "{{input.value}}"</td>
            </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
    </div>
</div>
