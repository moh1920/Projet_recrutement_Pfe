<div class="permission-management-container">
  <div class="header">
    <h2>Gestion des Permissions par Rôle</h2>
  </div>

  <mat-card class="role-selector-card">
    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Sélectionner un Rôle</mat-label>
        <mat-select [(ngModel)]="selectedRole" (selectionChange)="onRoleChange()">
          <mat-option *ngFor="let role of roles" [value]="role">
            {{ role | titlecase }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </mat-card-content>
  </mat-card>

  <mat-card *ngIf="selectedRole" class="menus-card">
    <mat-card-header>
      <mat-card-title>Menus accessibles pour le rôle: <strong>{{ selectedRole | titlecase }}</strong></mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="menu-list">
        <div *ngFor="let menu of allMenus" class="menu-item">
          <mat-checkbox 
            [checked]="isMenuSelected(menu.id)" 
            (change)="toggleMenu(menu.id, $event)"
            color="primary">
            <mat-icon class="menu-icon">{{ menu.icon }}</mat-icon>
            <span class="menu-label">{{ menu.label }}</span>
            <span class="menu-route" *ngIf="menu.route">({{ menu.route }})</span>
          </mat-checkbox>
        </div>
      </div>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-raised-button color="primary" (click)="savePermissions()">
        <mat-icon>save</mat-icon>
        Sauvegarder les permissions
      </button>
    </mat-card-actions>
  </mat-card>
</div>
